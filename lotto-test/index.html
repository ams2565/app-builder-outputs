<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 생성기</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#12100e;
    --paper:#f4efe4;
    --accent:#e4572e;
    --line:#2a2724;
  }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    background-image:radial-gradient(circle at 20% 0%,#241f1b 0%,#12100e 55%);
  }
  .wrap{max-width:620px;margin:0 auto}
  header{border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:26px}
  .kicker{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:10px;
  }
  h1{
    font-size:clamp(30px,9vw,52px);line-height:.95;font-weight:800;
    letter-spacing:-.03em;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .sub{margin-top:12px;font-size:13px;color:#8d857c;letter-spacing:.02em}

  .panel{
    background:#191612;border:1px solid var(--line);
    border-radius:2px;padding:20px;margin-bottom:24px;
  }
  label{display:block;font-size:12px;letter-spacing:.2em;color:#8d857c;margin-bottom:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=number]{
    flex:1;min-width:120px;background:#0d0b09;border:1px solid var(--line);
    color:var(--paper);font-size:26px;font-weight:800;padding:12px 16px;
    border-radius:2px;font-family:inherit;outline:none;
  }
  input[type=number]:focus{border-color:var(--accent)}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:2px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:800;
    padding:14px 26px;letter-spacing:.08em;transition:.15s;
  }
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(1px)}
  .chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .chip{
    background:transparent;border:1px solid var(--line);color:#8d857c;
    font-size:12px;padding:6px 12px;font-weight:600;letter-spacing:0;
  }
  .chip:hover{border-color:var(--accent);color:var(--paper);background:transparent}

  .ticket{
    background:var(--paper);color:var(--ink);border-radius:2px;
    padding:16px 14px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;
    animation:pop .35s cubic-bezier(.2,.9,.3,1.4) both;
    position:relative;overflow:hidden;
  }
  .ticket:before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .idx{
    font-size:11px;font-weight:800;letter-spacing:.1em;color:#9a9086;
    min-width:26px;padding-left:6px;
  }
  .balls{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .ball{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#fff;
    box-shadow:inset -2px -3px 6px rgba(0,0,0,.28);
    animation:spin .4s ease both;
  }
  @keyframes spin{from{opacity:0;transform:rotate(-140deg) scale(.4)}to{opacity:1;transform:none}}
  .c1{background:#f2b705;color:#3b2c00}
  .c2{background:#2b7fd4}
  .c3{background:#d63b3b}
  .c4{background:#5c5750}
  .c5{background:#2f9e6b}

  .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:#8d857c;margin:22px 0 12px;
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .meta button{background:transparent;color:#8d857c;border:1px solid var(--line);padding:8px 14px;font-size:12px}
  .meta button:hover{color:var(--paper);border-color:var(--accent)}
  .empty{text-align:center;color:#5f5951;font-size:13px;padding:34px 0;border:1px dashed var(--line)}
  footer{margin-top:34px;font-size:11px;color:#4f4941;line-height:1.7;text-align:center}
  @media(max-width:400px){.ball{width:33px;height:33px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Lucky Draw 1–45</div>
    <h1>로또 번호<br><em>생성기</em></h1>
    <div class="sub">뽑고 싶은 게임 수를 입력하세요 · 1게임 = 6개 번호</div>
  </header>

  <div class="panel">
    <label>게임 수 (1 ~ 20)</label>
    <div class="row">
      <input type="number" id="cnt" min="1" max="20" value="5">
      <button id="go">번호 뽑기</button>
    </div>
    <div class="chips">
      <button class="chip" data-n="1">1게임</button>
      <button class="chip" data-n="5">5게임</button>
      <button class="chip" data-n="10">10게임</button>
      <button class="chip" data-n="20">20게임</button>
    </div>
  </div>

  <div id="out"><div class="empty">아직 뽑은 번호가 없습니다</div></div>

  <div class="meta" id="meta" style="display:none">
    <span id="stamp"></span>
    <button id="copy">번호 복사</button>
  </div>

  <footer>이 도구는 순수 난수(crypto)로 번호를 생성합니다.<br>당첨을 보장하지 않으며 재미로만 이용하세요.</footer>
</div>

<script>
const out=document.getElementById('out'),meta=document.getElementById('meta');
const cnt=document.getElementById('cnt'),stamp=document.getElementById('stamp');
let last=[];

function rand(max){
  const a=new Uint32Array(1),lim=Math.floor(4294967296/max)*max;
  let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=lim);
  return v%max;
}
function draw(){
  const pool=[];for(let i=1;i<=45;i++)pool.push(i);
  const p=[];
  for(let i=0;i<6;i++)p.push(pool.splice(rand(pool.length),1)[0]);
  return p.sort((a,b)=>a-b);
}
function cls(n){return n<=10?'c1':n<=20?'c2':n<=30?'c3':n<=40?'c4':'c5'}

function render(sets){
  out.innerHTML='';
  sets.forEach((s,i)=>{
    const t=document.createElement('div');
    t.className='ticket';t.style.animationDelay=(i*60)+'ms';
    t.innerHTML='<div class="idx">'+String(i+1).padStart(2,'0')+'</div><div class="balls">'+
      s.map((n,j)=>'<div class="ball '+cls(n)+'" style="animation-delay:'+(i*60+j*55+120)+'ms">'+n+'</div>').join('')+
      '</div>';
    out.appendChild(t);
  });
  meta.style.display='flex';
  stamp.textContent=new Date().toLocaleString('ko-KR')+' · '+sets.length+'게임';
}

function go(){
  let n=parseInt(cnt.value,10);
  if(isNaN(n)||n<1)n=1;if(n>20)n=20;
  cnt.value=n;
  last=Array.from({length:n},draw);
  render(last);
}
document.getElementById('go').onclick=go;
cnt.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cnt.value=b.dataset.n;go()});
document.getElementById('copy').onclick=function(){
  const txt=last.map((s,i)=>(i+1)+'게임: '+s.join(', ')).join('\n');
  const done=()=>{this.textContent='복사 완료!';setTimeout(()=>this.textContent='번호 복사',1400)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done)}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}
};
</script>
</body>
</html>
