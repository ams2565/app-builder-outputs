<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨이팅 보드 · 카페 대기줄 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#211913; --paper:#f4ede1; --card:#fffdf8;
  --bean:#6b3f2a; --crema:#d9a441; --leaf:#3f6b4f; --red:#b4432e;
  --line:#e2d5c0;
}
body{
  background:var(--paper);
  background-image:radial-gradient(circle at 12% 8%,#e9dcc6 0 1px,transparent 1px),radial-gradient(circle at 60% 70%,#e9dcc6 0 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding:14px; line-height:1.45;
}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--bean);padding-bottom:10px;margin-bottom:16px}
h1{font-size:27px;letter-spacing:-1.2px;font-weight:800}
h1 span{display:block;font-size:11px;letter-spacing:5px;font-weight:600;color:var(--bean);text-transform:uppercase}
.status{margin-left:auto;font-size:12px;color:var(--bean);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:96px;border:2px solid var(--ink);background:transparent;padding:9px 6px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:2px;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:3px;padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 rgba(33,25,19,.13)}
.card h2{font-size:14px;letter-spacing:2px;color:var(--bean);margin-bottom:10px;text-transform:uppercase}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:#6a5b4a}
input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:3px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--crema);border-color:var(--crema)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;padding:8px 12px;font:inherit;font-weight:700;border-radius:20px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--bean);color:#fff;border-color:var(--bean)}
.big{width:100%;padding:14px;background:var(--bean);color:#fff;border:none;border-radius:3px;font:inherit;font-size:17px;font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:12px}
.big:active{transform:translateY(1px)}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--ink);color:var(--paper);border-radius:3px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat i{font-style:normal;font-size:11px;letter-spacing:1px;opacity:.75}
.team{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-left:7px solid var(--crema);border-radius:3px;padding:10px 12px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.team.called{border-left-color:var(--red);background:#fff6f2}
.no{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;min-width:52px}
.meta{flex:1;min-width:130px}
.meta b{font-size:16px}
.meta small{display:block;color:#7d6d5c;font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#efe6d5;color:var(--bean);margin-left:6px}
.tag.call{background:var(--red);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1.5px solid var(--ink);background:#fff;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;border-radius:3px;cursor:pointer}
.acts .p{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.acts .c{background:var(--red);color:#fff;border-color:var(--red)}
.acts .x{color:#8a7a68;border-color:var(--line)}
.empty{text-align:center;padding:26px 10px;color:#9a8a78;font-size:14px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.hist s{color:#a08f7d}
.board{text-align:center;padding:22px 12px}
.board .now{font-size:13px;letter-spacing:3px;color:var(--bean)}
.board .cur{font-size:84px;font-weight:800;letter-spacing:-5px;line-height:1;font-variant-numeric:tabular-nums}
.board ol{list-style:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.board li{border:2px dashed var(--line);border-radius:3px;padding:8px 12px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.board li small{display:block;font-size:11px;font-weight:600;color:#8a7a68}
footer{text-align:center;font-size:11px;color:#9a8a78;padding:10px 0 24px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.no{font-size:26px;min-width:44px}.board .cur{font-size:62px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span>Waiting Board</span>카페 대기줄 관리</h1>
  <div class="status" id="status">불러오는 중…</div>
</header>

<div class="tabs">
  <button data-v="reg" class="on">＋ 대기 접수</button>
  <button data-v="list">대기 현황</button>
  <button data-v="board">대기표 화면</button>
  <button data-v="hist">완료 기록</button>
</div>

<section id="v-reg">
  <div class="card">
    <h2>새 팀 등록</h2>
    <div class="grid">
      <div><label>고객명 / 별칭</label><input id="f-name" placeholder="예: 김민지"></div>
      <div><label>연락처 뒷 4자리</label><input id="f-phone" inputmode="numeric" maxlength="4" placeholder="1234"></div>
    </div>
    <label>인원</label>
    <div class="chips" id="f-size">
      <button data-s="1">1명</button><button data-s="2" class="on">2명</button>
      <button data-s="3">3명</button><button data-s="4">4명</button>
      <button data-s="5">5명+</button>
    </div>
    <label style="margin-top:12px">이용 형태</label>
    <div class="chips" id="f-type">
      <button data-t="홀" class="on">홀 이용</button>
      <button data-t="창가">창가 희망</button>
      <button data-t="포장">포장</button>
    </div>
    <button class="big" id="btn-add">대기 등록하고 번호 발급</button>
  </div>
  <div class="card">
    <h2>설정</h2>
    <label>팀당 예상 회전 시간 (분)</label>
    <input id="f-avg" type="number" min="1" max="90" value="8" style="max-width:140px">
  </div>
</section>

<section id="v-list" hidden>
  <div class="stats">
    <div class="stat"><b id="s-teams">0</b><i>대기 팀</i></div>
    <div class="stat"><b id="s-people">0</b><i>대기 인원</i></div>
    <div class="stat"><b id="s-wait">0분</b><i>예상 대기</i></div>
  </div>
  <div class="card"><h2>현재 줄</h2><div id="queue"></div></div>
</section>

<section id="v-board" hidden>
  <div class="card board">
    <div class="now">NOW CALLING</div>
    <div class="cur" id="b-cur">–</div>
    <div id="b-name" style="font-size:15px;color:#6b3f2a;font-weight:700">호출된 팀이 없습니다</div>
    <ol id="b-next"></ol>
    <div style="margin-top:18px;font-size:12px;color:#9a8a78">번호가 호출되면 카운터로 와주세요 ☕</div>
  </div>
</section>

<section id="v-hist" hidden>
  <div class="card">
    <h2>오늘 완료 · 취소</h2>
    <div id="hist"></div>
    <button class="big" id="btn-reset" style="background:#8a7a68;font-size:14px">하루 마감 (전체 초기화)</button>
  </div>
</section>

<footer>대기 데이터는 공유 저장소에 기록되어 여러 기기에서 같이 볼 수 있습니다.</footer>
</div>

<script>
const DATA_URL = "https://meeting-secretary-hub-sable.vercel.app/api/app-builder/data?slug=cafe-queue-test";
async function loadData(){ const r = await fetch(DATA_URL); return r.ok ? r.json() : {}; }
async function saveData(state){ await fetch(DATA_URL, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(state) }); }

let state = { seq: 0, avg: 8, teams: [] };
let form = { size: 2, type: "홀" };
const $ = s => document.querySelector(s);
const st = $("#status");
function setStatus(t){ st.textContent = t; }

async function push(msg){
  setStatus("저장 중…");
  try { await saveData(state); setStatus(msg || "저장됨 · " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})); }
  catch(e){ setStatus("⚠ 저장 실패 (네트워크)"); }
}

async function pull(){
  try{
    const d = await loadData();
    if(d && Array.isArray(d.teams)){ state = { seq:d.seq||0, avg:d.avg||8, teams:d.teams }; }
    setStatus("동기화 " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ setStatus("⚠ 불러오기 실패"); }
  $("#f-avg").value = state.avg;
  render();
}

function mins(ts){ return Math.max(0, Math.round((Date.now()-ts)/60000)); }
function waiting(){ return state.teams.filter(t=>t.status==="waiting"||t.status==="called"); }

function add(){
  const name = $("#f-name").value.trim() || "손님";
  const phone = $("#f-phone").value.trim();
  state.seq += 1;
  state.teams.push({ id:Date.now(), no:state.seq, name, phone, size:form.size, type:form.type, status:"waiting", at:Date.now() });
  $("#f-name").value=""; $("#f-phone").value="";
  render(); push("№" + state.seq + " 등록됨");
  switchView("list");
}

function act(id, s){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  if(s==="delete"){ state.teams = state.teams.filter(x=>x.id!==id); }
  else { t.status = s; t.doneAt = Date.now(); if(s==="called") t.calledAt = Date.now(); }
  render(); push();
}

function render(){
  const q = waiting();
  $("#s-teams").textContent = q.length;
  $("#s-people").textContent = q.reduce((a,b)=>a+b.size,0);
  $("#s-wait").textContent = (q.filter(t=>t.status==="waiting").length * state.avg) + "분";

  const box = $("#queue");
  if(!q.length){ box.innerHTML = '<div class="empty">대기 중인 팀이 없습니다 🍃</div>'; }
  else{
    box.innerHTML = "";
    q.forEach((t,i)=>{
      const el = document.createElement("div");
      el.className = "team" + (t.status==="called" ? " called" : "");
      el.innerHTML =
        '<div class="no">'+String(t.no).padStart(2,"0")+'</div>'+
        '<div class="meta"><b>'+esc(t.name)+'</b>'+
        (t.phone?'<span class="tag">'+esc(t.phone)+'</span>':'')+
        '<span class="tag'+(t.status==="called"?" call":"")+'">'+(t.status==="called"?"호출됨":t.type)+'</span>'+
        '<small>'+t.size+'명 · 대기 '+mins(t.at)+'분 · 앞에 '+i+'팀 (약 '+(i*state.avg)+'분)</small></div>'+
        '<div class="acts">'+
        (t.status==="waiting"?'<button class="c" data-a="called">호출</button>':'<button data-a="waiting">되돌리기</button>')+
        '<button class="p" data-a="seated">착석</button>'+
        '<button class="x" data-a="canceled">취소</button></div>';
      el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(t.id, b.dataset.a));
      box.appendChild(el);
    });
  }

  const called = q.filter(t=>t.status==="called");
  const cur = called[0];
  $("#b-cur").textContent = cur ? String(cur.no).padStart(2,"0") : "–";
  $("#b-name").textContent = cur ? esc(cur.name)+"님 · "+cur.size+"명 · "+cur.type : "호출된 팀이 없습니다";
  $("#b-next").innerHTML = q.filter(t=>t.status==="waiting").slice(0,5)
    .map((t,i)=>'<li>'+String(t.no).padStart(2,"0")+'<small>약 '+((i+1)*state.avg)+'분</small></li>').join("")
    || '<li style="font-size:14px;border:none">대기 없음</li>';

  const done = state.teams.filter(t=>t.status==="seated"||t.status==="canceled").slice().reverse();
  $("#hist").innerHTML = done.length ? done.map(t=>{
    const lab = t.status==="seated" ? "✔ 착석" : "✕ 취소";
    const body = String(t.no).padStart(2,"0")+" "+esc(t.name)+" · "+t.size+"명 · "+t.type;
    return '<div class="hist"><span>'+(t.status==="canceled"?"<s>"+body+"</s>":body)+'</span><span>'+lab+' '+new Date(t.doneAt||t.at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})+'</span></div>';
  }).join("") : '<div class="empty">아직 기록이 없습니다</div>';
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function switchView(v){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  ["reg","list","board","hist"].forEach(k=>{ $("#v-"+k).hidden = (k!==v); });
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>switchView(b.dataset.v));
$("#f-size").onclick = e=>{ if(e.target.dataset.s){ form.size=+e.target.dataset.s; $("#f-size").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===e.target)); } };
$("#f-type").onclick = e=>{ if(e.target.dataset.t){ form.type=e.target.dataset.t; $("#f-type").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===e.target)); } };
$("#btn-add").onclick = add;
$("#f-avg").onchange = e=>{ state.avg = Math.max(1, +e.target.value||8); render(); push("설정 저장됨"); };
$("#btn-reset").onclick = ()=>{ if(confirm("오늘 대기 기록을 모두 지우고 번호를 1번부터 다시 시작할까요?")){ state = { seq:0, avg:state.avg, teams:[] }; render(); push("초기화됨"); } };
$("#f-phone").addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
$("#f-name").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#f-phone").focus(); });

pull();
setInterval(render, 30000);
setInterval(pull, 60000);
</script>
</body>
</html>
